# ─────────────────────────────────────────────────────────────
#  Maison — production stack (single server)
#
#    cp .env.production.example .env.production   # then fill in the secrets
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
#  Topology: only Caddy is public. It terminates HTTPS (automatic Let's Encrypt
#  certificates) and forwards to the Next.js storefront, which proxies /api/v1 and
#  /uploads to the private API. PostgreSQL is never exposed.
#
#    internet ─▶ caddy :80/:443 ─▶ web :3000 ─▶ api :4000 ─▶ postgres :5432
#
#  See docs/DEPLOYMENT.md for the full guide.
# ─────────────────────────────────────────────────────────────

name: maison-prod

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-maison}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maison}?schema=public
  WEB_URL: https://${DOMAIN:?set DOMAIN}
  # Uploads are served through the storefront (/uploads → API), so they share its origin.
  API_URL: https://${DOMAIN}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  COOKIE_SECURE: "true"
  TRUST_PROXY: 2
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
  STOREFRONT_INTERNAL_URL: http://web:3000
  PLAN: ${PLAN:-premium}
  STORE_CURRENCY: ${STORE_CURRENCY:-USD}
  STORE_LOCALE: ${STORE_LOCALE:-en-US}
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-maison}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-Maison <no-reply@${DOMAIN}>}
  ORDER_RESERVATION_MINUTES: ${ORDER_RESERVATION_MINUTES:-30}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maison}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maison}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: applies pending Prisma migrations, then exits. Also used for seeding:
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate npm run db:seed
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    image: maison-api-tools
    restart: "no"
    environment:
      <<: *api-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ALLOW_RESET: ${SEED_ALLOW_RESET:-false}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: maison-api
    restart: unless-stopped
    environment: *api-env
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:4000
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STORE_CURRENCY: ${STORE_CURRENCY:-USD}
        NEXT_PUBLIC_STORE_LOCALE: ${STORE_LOCALE:-en-US}
    image: maison-web
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    volumes:
      - next-cache:/app/apps/web/.next/cache
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  next-cache:
  caddy-data:
  caddy-config:
